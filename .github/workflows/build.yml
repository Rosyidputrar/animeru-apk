name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Buat rilis dengan tag ini (mis. v1.2.0). Kosongkan untuk build biasa."
        required: false
        default: ""

permissions:
  contents: write # untuk membuat GitHub Release saat tag v* di-push

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Versi
        id: ver
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG=""
          if [[ -n "$INPUT_TAG" ]]; then TAG="$INPUT_TAG"; elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; fi
          if [[ -n "$TAG" && ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then echo "::error::Tag harus berbentuk v1.2.3 (dapat: $TAG)"; exit 1; fi
          if [[ -n "$TAG" ]]; then NAME="${TAG#v}"; else NAME="1.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Kunci release dari Secrets (opsional). Tanpa secrets → APK ditandatangani debug key.
      - name: Siapkan kunci release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > animeruu-release.jks
            {
              echo "storeFile=animeruu-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "Kunci release dipakai."
          else
            echo "::warning::Secret KEYSTORE_BASE64 tidak ada — APK ditandatangani debug key."
          fi

      - name: Unit test
        run: ./gradlew :app:testReleaseUnitTest --stacktrace

      - name: Build APK release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Ganti nama APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Animeruu-${{ steps.ver.outputs.name }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Animeruu-${{ steps.ver.outputs.name }}
          path: out/*.apk
          retention-days: 30

      # Catatan rilis: docs/releases/<tag>.md bila ada (tampil juga di "Apa yang baru" dalam aplikasi),
      # selain itu dibuat otomatis oleh GitHub dari commit/PR.
      - name: Catatan rilis
        id: notes
        if: steps.ver.outputs.tag != ''
        run: |
          f="docs/releases/${RELEASE_TAG}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; echo "auto=false" >> "$GITHUB_OUTPUT"
          else echo "path=" >> "$GITHUB_OUTPUT"; echo "auto=true" >> "$GITHUB_OUTPUT"; fi

      - name: GitHub Release
        if: steps.ver.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Animeruu ${{ steps.ver.outputs.name }}
          files: out/*.apk
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.auto == 'true' }}

      - name: Hapus kunci
        if: always()
        run: rm -f animeruu-release.jks keystore.properties
